# Test configuration: use an in-memory H2 database so the Spring context can start
# reliably during Maven test/build runs without depending on external MySQL.
spring.datasource.url=jdbc:h2:mem:bicap_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Redis configuration for tests
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.ssl.enabled=false
# Tests/CI intentionally run without a Redis server: caching must be turned off
# EXPLICITLY (production requires Redis and refuses to boot without it).
app.cache.enabled=false
management.health.redis.enabled=false

# Tests/CI run the simulated stack (H2 + mock blockchain + no Redis): bật cờ này một
# cách có ý thức. Production để false ⇒ bắt buộc MySQL remote + blockchain live + Redis.
app.allow-simulation=true
blockchain.mode=mock
bicap.blockchain.export-mode=vechain

# Test-only secrets required by the app during startup.
# NOTE: these MUST NOT be the values shipped in the repository history — the
# SecureSecretInitializer rejects publicly known defaults, and a missing secret is now
# fatal in every profile (no ephemeral dev secret is generated anymore).
app.jwt.secret=VGVzdE9ubHlKa3RTZWNyZXRLZXlNYXRlcmlhbEZvckJJQ0FQQ0lUZXN0cw==
app.jwt.expiration-ms=86400000
app.frontend.url=http://localhost:5174
sepay.api-key=test-only-sepay-webhook-key
sepay.account-no=123456789
sepay.bank-name=MBBank
