# Test configuration: use an in-memory H2 database so the Spring context can start
# reliably during Maven test/build runs without depending on external MySQL.
spring.datasource.url=jdbc:h2:mem:bicap_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Redis configuration for tests
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.ssl.enabled=false

# Test-only secrets required by the app during startup
app.jwt.secret=dGVzdC1qd3Qtc2VjcmV0LWtleS1hdC1sZWFzdC0zMi1ieXRlcw==
app.jwt.expiration-ms=86400000
app.mail.from=test@bicap.local
app.frontend.url=http://localhost:5174
spring.mail.host=localhost
sepay.api-key=test-sepay-api-key
sepay.account-no=123456789
sepay.bank-name=MBBank
