# Server Port Configuration
server.port=${SERVER_PORT:8080}

# Database Configuration
# Local development defaults to an embedded H2 database so the backend can start
# without external MySQL. Set SPRING_DATASOURCE_URL/USERNAME/PASSWORD to override.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:bicap_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Driver is auto-detected from the JDBC URL (H2 vs MySQL) unless explicitly overridden
# via SPRING_DATASOURCE_DRIVER_CLASS_NAME.
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:}

# JPA / Hibernate Configuration
# - Production uses ddl-auto=validate so silent schema mutation (from ddl-auto=update)
#   can never happen against a real database. Demo/test profiles override to 'update'
#   so the H2 in-memory schema still builds itself.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Dialect is auto-detected from the JDBC connection (H2 vs MySQL) unless explicitly
# overridden via SPRING_JPA_DATABASE_PLATFORM.
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:}

# ------------------------------------------------------------------------
# Caching Configuration (Redis)
# ------------------------------------------------------------------------
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${SPRING_REDIS_SSL:false}
# Short timeouts so the app can start (and fall back to in-memory cache) fast
# when Redis is not configured/reachable in the environment.
spring.data.redis.connect-timeout=${SPRING_REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${SPRING_REDIS_TIMEOUT:2s}
# Redis must never flip /actuator/health (used by the Docker HEALTHCHECK) to DOWN.
management.health.redis.enabled=false
# SMTP is optional in dev/CI; the mail health indicator must not report the whole
# application as DOWN (503) when no SMTP server is reachable.
management.health.mail.enabled=false

# Application cache (BICAP-79): provider auto-selects Redis when reachable, else in-memory.
app.cache.enabled=${APP_CACHE_ENABLED:true}
app.cache.ttl-seconds=${APP_CACHE_TTL_SECONDS:60}

# ------------------------------------------------------------------------
# Application & JWT Configuration
# ------------------------------------------------------------------------
spring.application.name=bicap-blockchain-agricultural-platform
# SECURITY (C-1): no secret is shipped in this file. When JWT_SECRET is absent,
# SecureSecretInitializer either refuses to boot (prod profile) or injects a fresh
# random per-process secret (dev/test) — a repository-known key can never be used.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.retailer-access-expiration-ms=${RETAILER_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${REFRESH_TOKEN_EXPIRATION_MS:604800000}
app.jwt.verification-expiration-ms=${VERIFICATION_TOKEN_EXPIRATION_MS:86400000}

# SECURITY (M-7/CR-06): the auth rate limiter keys on the socket address by default because
# X-Forwarded-For is client-controlled. Enable this ONLY behind a trusted reverse proxy that
# overwrites the header; otherwise a client can rotate it to bypass the 30 req/min limit.
app.security.trust-forwarded-for=${TRUST_FORWARDED_FOR:false}

# Retailer email verification (BICAP-36)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:no-reply@bicap.local}
app.frontend.url=${FRONTEND_URL:http://localhost:5174}
app.upload.dir=${UPLOAD_DIR:uploads}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ------------------------------------------------------------------------
# Payment Gateway (Sepay) Configuration
# ------------------------------------------------------------------------
sepay.account-no=${SEPAY_ACCOUNT_NO:0362600223}
sepay.bank-name=${SEPAY_BANK_NAME:VietinBank}
# SECURITY (C-3): no webhook key is shipped in this file — see SecureSecretInitializer.
sepay.api-key=${SEPAY_API_KEY:}

# ------------------------------------------------------------------------
# Blockchain (VeChainThor) Configuration
# mode=mock  : local/CI — hashes are simulated, no network needed (default)
# mode=live  : real RLP-encoded, secp256k1-signed transactions broadcast to
#              the node below; confirmation + auto-retry run in background (BICAP-80)
# ------------------------------------------------------------------------
blockchain.mode=${BLOCKCHAIN_MODE:mock}
blockchain.node-url=${BLOCKCHAIN_NODE_URL:https://testnet.vechain.org}
blockchain.private-key=${BLOCKCHAIN_PRIVATE_KEY:}
# Legacy type-0 tx uses gasPriceCoef (uint8 0..255); node derives the price.
# 0 = base price (cheapest), 255 = max price (most reliable when congested).
blockchain.gas-price-coef=${BLOCKCHAIN_GAS_PRICE_COEF:0}
blockchain.gas-attest=${BLOCKCHAIN_GAS_ATTEST:53000}
blockchain.gas-deploy=${BLOCKCHAIN_GAS_DEPLOY:10000000}
blockchain.expiration=${BLOCKCHAIN_EXPIRATION:720}
blockchain.confirm-interval-ms=${BLOCKCHAIN_CONFIRM_INTERVAL_MS:15000}
blockchain.retry-interval-ms=${BLOCKCHAIN_RETRY_INTERVAL_MS:60000}

# Which adapter anchors a season export + traceability QR (F1 fix).
# vechain (default) : the export receipt is anchored through BlockchainService —
#                     a real broadcast when blockchain.mode=live, a clearly-labelled
#                     simulated receipt when blockchain.mode=mock.
# local             : dev-only stub (SHA-256 of the export fields, never on-chain).
bicap.blockchain.export-mode=${BLOCKCHAIN_EXPORT_MODE:vechain}

