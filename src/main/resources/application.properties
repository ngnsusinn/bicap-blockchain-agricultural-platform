# Server Port Configuration
server.port=${SERVER_PORT:8080}

# Database Configuration
# Local development defaults to an embedded H2 database so the backend can start
# without external MySQL. Set SPRING_DATASOURCE_URL/USERNAME/PASSWORD to override.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:bicap_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA / Hibernate Configuration
# - Production uses ddl-auto=validate so silent schema mutation (from ddl-auto=update)
#   can never happen against a real database. Demo/test profiles override to 'update'
#   so the H2 in-memory schema still builds itself.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# ------------------------------------------------------------------------
# Caching Configuration (Redis)
# ------------------------------------------------------------------------
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${SPRING_REDIS_SSL:false}

# ------------------------------------------------------------------------
# Application & JWT Configuration
# ------------------------------------------------------------------------
spring.application.name=bicap-blockchain-agricultural-platform
# Local fallback values are provided so the application can start without environment
# variables being exported. In production you should still supply strong secrets.
app.jwt.secret=${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1hdC1sZWFzdC0zMi1ieXRlcw==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.retailer-access-expiration-ms=${RETAILER_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${REFRESH_TOKEN_EXPIRATION_MS:604800000}
app.jwt.verification-expiration-ms=${VERIFICATION_TOKEN_EXPIRATION_MS:86400000}

# Retailer email verification (BICAP-36)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:no-reply@bicap.local}
app.frontend.url=${FRONTEND_URL:http://localhost:5174}
app.upload.dir=${UPLOAD_DIR:uploads}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ------------------------------------------------------------------------
# Payment Gateway (Sepay) Configuration
# ------------------------------------------------------------------------
sepay.account-no=${SEPAY_ACCOUNT_NO:123456789}
sepay.bank-name=${SEPAY_BANK_NAME:MBBank}
# Local fallback values are provided so the application can start without environment
# variables being exported. In production you should still supply a real key.
sepay.api-key=${SEPAY_API_KEY:test-sepay-api-key}

# ------------------------------------------------------------------------
# Blockchain (VeChainThor) Configuration
# ------------------------------------------------------------------------
blockchain.mode=${BLOCKCHAIN_MODE:mock}
blockchain.node-url=${BLOCKCHAIN_NODE_URL:https://node-testnet.vechain.dev}
blockchain.private-key=${BLOCKCHAIN_PRIVATE_KEY:}

# ------------------------------------------------------------------------
# Actuator / Health Check
# Exclude mail health indicator when SMTP is not configured (local dev).
# The /actuator/health endpoint will return 200 UP instead of 503.
# ------------------------------------------------------------------------
management.health.mail.enabled=${ACTUATOR_MAIL_HEALTH:false}
management.health.redis.enabled=false
management.endpoints.web.exposure.include=health,info

# ------------------------------------------------------------------------
# H2 Console (local dev only — only active when H2 datasource is in use)
# ------------------------------------------------------------------------
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

