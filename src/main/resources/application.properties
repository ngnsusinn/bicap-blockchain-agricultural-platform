# Spring Boot Application Properties
server.port=${SERVER_PORT:8080}

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bicap_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET:your_super_secret_key_which_should_be_at_least_32_bytes_long_for_hs256_algorithm_12345}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
spring.application.name=bicap-blockchain-agricultural-platform
server.port=8080

# ------------------------------------------------------------------------
# Cloud-Hosted Database Configuration (MySQL)
# ------------------------------------------------------------------------
# Connects to your online database (e.g. AWS RDS, Supabase, Clever Cloud, Aiven)
# spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://your-cloud-mysql-host:3306/bicap_db?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true}
# spring.datasource.username=${SPRING_DATASOURCE_USERNAME:your_cloud_user}
# spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:your_cloud_password}
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ------------------------------------------------------------------------
# Cloud-Hosted Caching Configuration (Redis)
# ------------------------------------------------------------------------
# Connects to your online cache (e.g. Upstash Redis, Redis Enterprise Cloud)
spring.data.redis.host=${SPRING_REDIS_HOST:your-cloud-redis-host}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:your_cloud_redis_password}
spring.data.redis.ssl.enabled=${SPRING_REDIS_SSL:true}

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

