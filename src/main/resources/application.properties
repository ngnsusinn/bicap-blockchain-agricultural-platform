# Server Port Configuration
server.port=${SERVER_PORT:8080}

# Database Configuration (MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bicap_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ------------------------------------------------------------------------
# Caching Configuration (Redis)
# ------------------------------------------------------------------------
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${SPRING_REDIS_SSL:false}

# ------------------------------------------------------------------------
# Application & JWT Configuration
# ------------------------------------------------------------------------
spring.application.name=bicap-blockchain-agricultural-platform
app.jwt.secret=${JWT_SECRET:your_super_secret_key_which_should_be_at_least_32_bytes_long_for_hs256_algorithm_12345}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ------------------------------------------------------------------------
# Payment Gateway (Sepay) Configuration
# ------------------------------------------------------------------------
sepay.account-no=${SEPAY_ACCOUNT_NO:123456789}
sepay.bank-name=${SEPAY_BANK_NAME:MBBank}
sepay.api-key=${SEPAY_API_KEY:YOUR_SEPAY_API_KEY}