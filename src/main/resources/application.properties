# Spring Boot Application Properties
server.port=${SERVER_PORT:8080}

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bicap_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET:your_super_secret_key_which_should_be_at_least_32_bytes_long_for_hs256_algorithm_12345}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
