# Database Configuration for Tests (In-memory H2 fallback)
spring.datasource.url=jdbc:h2:mem:bicap_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Redis Configuration override for tests (prevents context failure)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.ssl.enabled=false

# VeChain URL for tests
vechain.node.url=https://testnet.vechain.org

# JWT Config for tests
app.jwt.secret=your_super_secret_key_which_should_be_at_least_32_bytes_long_for_hs256_algorithm_12345
app.jwt.expiration-ms=86400000
