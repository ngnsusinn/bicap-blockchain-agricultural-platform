# Database Configuration for Tests (In-memory H2 fallback)
spring.datasource.url=jdbc:h2:mem:bicap_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Redis Configuration override for tests (prevents context failure)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.ssl.enabled=false

# Test-only secrets — the app now fails startup when these are unset, so the
# test context provides fixed values. Base64 of a 32+ byte key (see JwtTokenProvider).
app.jwt.secret=dGVzdC1qd3Qtc2VjcmV0LWtleS1hdC1sZWFzdC0zMi1ieXRlcw==
app.jwt.expiration-ms=86400000
sepay.api-key=test-sepay-api-key
sepay.account-no=123456789
sepay.bank-name=MBBank
